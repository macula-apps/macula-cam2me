<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-label="macula-cam2me system context">
<title>macula-cam2me system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="760"/>
<rect class="b-per" x="40" y="30" width="300" height="120" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Phone owner</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Installs the app, enters their own</text>
<text class="t-desc" x="56" y="116">number, adds contacts by number,</text>
<text class="t-desc" x="56" y="132">picks auto or a fixed station</text>
<rect class="b-per" x="660" y="30" width="300" height="120" rx="10"/>
<circle class="head" cx="686" cy="54" r="9"/>
<text class="t-name" x="704" y="58">Contact</text>
<text class="t-type" x="704" y="76">[Person]</text>
<text class="t-desc" x="676" y="100">Another phone running cam2me whose</text>
<text class="t-desc" x="676" y="116">number the owner added. Later: dials</text>
<text class="t-desc" x="676" y="132">in to watch the camera (#6)</text>
<rect class="b-sys" x="340" y="210" width="320" height="152" rx="10"/>
<text class="t-name" x="356" y="238">macula-cam2me</text>
<text class="t-type" x="356" y="256">[Android app; iOS skeleton]</text>
<text class="t-desc" x="356" y="280">One node identity per phone. Holds up</text>
<text class="t-desc" x="356" y="296">to 3 station sessions, publishes and</text>
<text class="t-desc" x="356" y="312">hears presence on cam2me.presence,</text>
<text class="t-desc" x="356" y="328">matches it to contacts. No camera yet</text>
<rect class="b-ext" x="40" y="450" width="280" height="136" rx="10"/>
<text class="t-name" x="56" y="478">Android platform</text>
<text class="t-type" x="56" y="496">[External system]</text>
<text class="t-desc" x="56" y="520">The Keystore holds the node seed;</text>
<text class="t-desc" x="56" y="536">coarse location picks the nearest</text>
<text class="t-desc" x="56" y="552">stations</text>
<rect class="b-mac" x="360" y="450" width="280" height="136" rx="10"/>
<text class="t-name" x="376" y="478">Macula stations</text>
<text class="t-type" x="376" y="496">[Macula infrastructure]</text>
<text class="t-desc" x="376" y="520">QUIC sessions, the pubsub fan-out</text>
<text class="t-desc" x="376" y="536">of cam2me.presence, and the route</text>
<text class="t-desc" x="376" y="552">for list_stations. On wire 1.0:</text>
<text class="t-desc" x="376" y="568">unreachable from this SDK (#3)</text>
<rect class="b-mac" x="680" y="450" width="280" height="136" rx="10"/>
<text class="t-name" x="696" y="478">mcl-stations</text>
<text class="t-type" x="696" y="496">[Macula infrastructure]</text>
<text class="t-desc" x="696" y="520">The station directory, nearest</text>
<text class="t-desc" x="696" y="536">first. The app still calls the</text>
<text class="t-desc" x="696" y="552">retired hecate_stations name, in</text>
<text class="t-desc" x="696" y="568">a realm that is not io.macula (#3)</text>
<path class="edge" d="M190 150V180H400V210" marker-end="url(#a)"/>
<text class="t-rel" x="200" y="168">number, contacts, station mode</text>
<path class="edge-later" d="M810 150V180H600V210" marker-end="url(#a)"/>
<text class="t-rel" x="620" y="168">watches the camera (planned, #6)</text>
<path class="edge" d="M400 362V410H180V450" marker-end="url(#a)"/>
<text class="t-rel" x="196" y="402">node seed, last location</text>
<path class="edge" d="M500 362V450" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="418">up to 3 sessions;</text>
<text class="t-rel" x="508" y="434">presence pub/sub</text>
<path class="edge" d="M600 362V410H820V450" marker-end="url(#a)"/>
<text class="t-rel" x="620" y="402">list_stations near (lat, lng): broken (#3)</text>
<text class="t-desc" x="40" y="616">The contact is the same app on another phone: both publish a heartbeat on cam2me.presence through every station they hold,</text>
<text class="t-desc" x="40" y="634">and each matches what it hears against its own contacts. Pull model: a viewer will dial the phone through one of those stations;</text>
<text class="t-desc" x="40" y="652">nothing listens on the phone itself. Today the app reaches no live station (#3), and the presence payload needs a redesign (#4).</text>
<rect class="b-sys" x="24" y="700" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="712">In scope</text>
<rect class="b-per" x="110.8" y="700" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="712">Person</text>
<rect class="b-mac" x="184.39999999999998" y="700" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="712">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="700" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="712">External system</text>
<rect class="b-cmp" x="490.0" y="700" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="712">Container or component</text>
<rect class="b-later" x="669.2" y="700" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="712">Planned, not built</text>
</svg>
